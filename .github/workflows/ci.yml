name: CI

# Full-suite validation runs here (GitHub's resources), not on developer machines.
# Local development uses the tiered protocol in CLAUDE.md: typecheck + affected tests.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-backend-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: jest-backend-${{ runner.os }}-
      - run: npm run test:backend -- --ci --maxWorkers=2 --cacheDirectory=.jest-cache

  ui-tests:
    name: ui-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-ui-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: jest-ui-${{ runner.os }}-
      - run: npm run test:ui -- --ci --maxWorkers=2 --cacheDirectory=.jest-cache
